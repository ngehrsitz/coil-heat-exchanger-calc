name: Build

on:
  push:
  pull_request:

permissions:
  contents: write  # needed for `gh release` to attach assets on tag pushes

jobs:
  build:
    strategy:
      fail-fast: false  # a Windows failure must not cancel the Linux build (and vice-versa)
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Build executable
        # PyInstaller cannot cross-compile — each OS in the matrix produces its
        # own native binary. --windowed suppresses the console for the PyQt6 GUI;
        # --collect-all CoolProp bundles the package's data files, and the
        # packaging/hooks/ hook additionally bundles CoolProp's vendored runtime
        # DLLs (the coolprop.libs/ folder) that --collect-all misses on Windows.
        run: uv run pyinstaller --noconfirm --onefile --windowed --name coil-heat-exchanger-calc --collect-all CoolProp --additional-hooks-dir packaging/hooks main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coil-heat-exchanger-calc-${{ runner.os }}
          path: dist/*
          retention-days: 30
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
