name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Qt headless rendering deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libdbus-1-3 \
            libxkbcommon0 \
            libfontconfig1
      - name: Install (locked)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: mypy (physics + sweep)
        run: uv run mypy
      - name: Tests + coverage gate
        # coverage + --cov-fail-under enforced via addopts
        run: uv run pytest -q
      - name: Coverage percentage
        # still report the % even if the gate above failed
        if: always()
        run: |
          pct=$(uv run coverage report --format=total --precision=2)
          echo "### Coverage: ${pct}%" >> "$GITHUB_STEP_SUMMARY"
